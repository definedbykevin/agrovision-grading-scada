version: "3.8"

# ═══════════════════════════════════════════════════════════════════════
# AgroVision DEV ENVIRONMENT (Laptop Developer)
# Menjalankan PostgreSQL 16 & Redis 7 lokal tanpa install service berat
#
# Cara Menjalankan:
#   docker compose -f docker-compose.dev.yml up -d
#
# Cara Menghentikan:
#   docker compose -f docker-compose.dev.yml down
# ═══════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    container_name: pis-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-200898}
      POSTGRES_DB: agrovision_main
    ports:
      - "5432:5432"
    volumes:
      - pis_postgres_dev_data:/var/lib/postgresql/data
      - ./docker/database/init-dev-databases.sql:/docker-entrypoint-initdb.d/01_init_databases.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pis-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pis_redis_dev_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  pis_postgres_dev_data:
  pis_redis_dev_data:
